<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="icon.png" sizes="96x96" />
    <meta name="author" content="Omar Morales">
    <title id="title">New GDPSs leaderboard</title>
    <meta name="description"
        content="A leaderboard for Geometry Dash Private Servers based on the total amount of Discord members each server has">
    <meta name="keywords"
        content="leaderboard, members, discord, geometry, dash, private, server, gd, gdps, hub, gdpshub">

    <meta name="robots" content="index">
    <meta http-equiv="content-language" content="en">

    <link rel="stylesheet" href="style.css">
<script src="https://neops.x10.mx/data/GDPSs/main.js"></script>
</head>
<body>
<div class="background">
    <div class="gradient gradient-1"></div>
    <div class="gradient gradient-2"></div>
    <div class="gradient gradient-3"></div>
</div>
<div class="page">
    <div id="header">
        <img src="icon.png" alt="Recent GDPSs logo" style="padding-top: 10px;">
        <h1>The Recent GDPSs Leaderboard</h1>
        <p>A leaderboard for Geometry Dash Private Servers based on the total amount of Discord members each server has</p>
        <p><a style="color: #616acd; text-decoration: underline;" href="https://github.com/M336G/gdps-leaderboard/issues" target="_blank">Tell me your new GDPS here!</a></p>
        <p id="loading">Starting...</p>
    </div>

    <div id="leaderboard"></div>

    <div id="pagination">
        <button id="previous">Previous</button>
        <span id="page-indicator"></span>
        <button id="next">Next</button>
    </div>
    <p id="error-message"></p>
    </div>
</body>
</html>
